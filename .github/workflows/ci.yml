name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mac:
    name: macOS (cargo)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  windows:
    name: Windows (cargo)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: 윈도우 전용 시험(자격 증명 관리자, 인터넷, 설정 창)
        # pwsh 는 마지막 명령의 종료 코드만 보므로 앞 명령이 실패해도 멈추게 한다.
        run: |
          cargo test -p sidedesk-windows -- --ignored windows_only_ --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p sidedesk-window -- --ignored windows_only_ --nocapture
      - name: 수집기 걸린 시간
        run: cargo test -p sidedesk-windows -- values_are_in_range lists_this_process --nocapture
      - run: cargo build --release -p sidedesk
      - name: 콘솔 명령(sidedesk-cli)의 종료 코드와 사용법
        shell: pwsh
        run: |
          $out = & ./target/release/sidedesk-cli.exe 모르는것 2>&1
          if ($LASTEXITCODE -ne 1) { throw "종료 코드 $LASTEXITCODE" }
          if (-not ($out -match 'sidedesk-cli pair')) { throw "사용법이 없음: $out" }
          Write-Output "종료 코드 1, $out"
          exit 0
      # 검사가 윈도우 경로를 실제로 잡는지: 경로 바꾸기 없이 빌드한 개발용 exe 는 걸려야 한다.
      - name: 경로 바꾸기 없는 exe 는 비밀값 검사에 걸림
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/sidedesk.exe)) { throw "검사할 exe 가 없음" }
          # 검사 스크립트는 UTF-8 로 찍으므로 그대로 읽는다(한글 요약 줄을 맞추려고).
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $out = python -I scripts/check_secrets.py --artifact target/release/sidedesk.exe 2>&1 | Out-String
          # 끝 코드 1 은 스크립트가 죽어도 나오므로, 홈 경로를 찾았다는 요약 줄까지 본다.
          if ($LASTEXITCODE -ne 1) { throw "경로 바꾸기 없는 exe 가 검사를 통과함(끝 코드 $LASTEXITCODE)" }
          if (-not ($out -match '(?m)^찾음: .*홈 경로')) { throw "홈 경로로 걸리지 않음: $out" }
          Write-Output $out
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          # 개발용: 경로 바꾸기와 비밀값 검사를 거치지 않았다. 배포 파일은 release.yml 의 windows 작업
          name: sidedesk-windows-dev
          path: |
            target/release/sidedesk.exe
            target/release/sidedesk-cli.exe
          retention-days: 7

  android:
    name: Android
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Gradle
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  ios:
    name: iOS (시뮬레이터)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 첫 실행(Xcode 26.6)에서 통과한 판으로 고정한다. 서버 이미지에서 빠지면 여기서 멈춘다.
      - name: 도구
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | head -1)
          test -n "$xcode" || { echo "Xcode 26.6 이 서버에 없음"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          command -v xcodegen > /dev/null || brew install xcodegen
      # SD-14 원칙: 값이 그대로면 매 프레임 그리기와 1초 타이머가 없다. 다시 들어오면 실패한다.
      - name: 매 프레임 그리기 없음
        run: |
          # 매 프레임 시계(.animation, AnimationTimelineSchedule), 정해진 간격 시계(.periodic, PeriodicTimelineSchedule,
          # Timer.publish), 끝없는 애니메이션(.repeatForever)을 찾는다. 줄을 나눠 쓴 TimelineView( 도 잡는다.
          # 보기용 값(Debug)은 디버그 빌드에만 있어 뺀다.
          if grep -rnE 'TimelineView\([[:space:]]*$|TimelineView\(\.animation|AnimationTimelineSchedule|\.animation\(minimumInterval|PeriodicTimelineSchedule|\.periodic\(|Timer\.publish\(every:|\.repeatForever' --exclude-dir=Debug ios/App; then
            echo "ios/App 에 매 프레임 또는 1초 타이머가 있습니다(MinuteSchedule, MusicTicks 를 쓰세요)"
            exit 1
          fi
      - name: 공용 코어
        run: scripts/build-ios.sh
      - name: 프로젝트
        working-directory: ios
        run: xcodegen
      # 서버 이미지마다 시뮬레이터가 다르므로 이름을 박지 않고, 가장 새 iOS 런타임의 첫 아이폰을 고른다.
      - name: 시뮬레이터
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              found = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return tuple(map(int, found.groups())) if found else None
          runtimes = sorted((version(r), r) for r in devices if version(r) and version(r) >= (18, 0))
          for _, runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"], runtime, phones[0]["name"], file=sys.stderr)
                  print(phones[0]["udid"])
                  break
          ')
          echo "SIM=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id" || true
      - name: 빌드
        id: build
        working-directory: ios
        run: xcodebuild build-for-testing -project SideDesk.xcodeproj -scheme SideDesk -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" -quiet
      - name: 시험
        working-directory: ios
        run: xcodebuild test-without-building -project SideDesk.xcodeproj -scheme SideDesk -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd"
      - name: 화면 찍기
        if: always() && steps.build.outcome == 'success'
        run: scripts/shoot-ios.sh "$SIM" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/SideDesk.app" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
