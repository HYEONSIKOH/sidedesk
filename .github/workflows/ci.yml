name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mac:
    name: macOS (cargo)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (cargo)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: 윈도우 전용 시험(자격 증명 관리자, 인터넷, 설정 창)
        run: |
          cargo test -p sidedesk-windows -- --ignored windows_only_ --nocapture
          cargo test -p sidedesk-window -- --ignored windows_only_ --nocapture
      - name: 수집기 걸린 시간
        run: cargo test -p sidedesk-windows -- values_are_in_range lists_this_process --nocapture
      - run: cargo build --release -p sidedesk
      - uses: actions/upload-artifact@v4
        with:
          name: sidedesk-windows
          path: target/release/sidedesk.exe
          retention-days: 7

  android:
    name: Android
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Gradle
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
