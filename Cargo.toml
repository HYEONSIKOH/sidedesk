[workspace]
resolver = "3"
members = [
    "core",
    "core/bindgen",
    "desktop/domain",
    "desktop/mac",
    "desktop/windows",
    "desktop/link",
    "desktop/window",
    "desktop/weather",
    "desktop/agents",
    "desktop/forge",
    "desktop/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
# 기호 지우기는 묶는 스크립트가 맥 strip 으로 한다(cargo 의 strip 은 툴체인에 따라 실패한다).
# 윈도우 msvc 는 기호가 PDB 로 빠지고, 안드로이드는 AGP 가 묶을 때 .so 기호를 지운다.
strip = false
# panic = "abort" 는 넣지 않는다: 어댑터 패닉을 catch_unwind 로 막는 곳이 있다.
