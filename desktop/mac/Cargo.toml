[package]
name = "sidedesk-mac"
version.workspace = true
edition.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
libc = "0.2"
sidedesk-domain = { path = "../domain" }
system-configuration-sys = "0.6"
sidedesk-core = { path = "../../core" }
objc2 = "0.6"
dispatch2 = "0.3"
objc2-core-bluetooth = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSArray", "NSValue", "NSStream", "NSUUID", "NSError", "NSObject", "NSEnumerator"] }
