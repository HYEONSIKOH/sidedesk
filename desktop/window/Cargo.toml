[package]
name = "sidedesk-window"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sidedesk-core = { path = "../../core" }
sidedesk-domain = { path = "../domain" }
tao = "0.38"
tray-icon = { version = "0.27", default-features = false }
wry = { version = "0.58", default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSToolbar", "NSResponder"] }
