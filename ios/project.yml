name: SideDesk
options:
  bundleIdPrefix: io.github.hyeonsikoh
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
targets:
  SideDesk:
    type: application
    platform: iOS
    sources:
      - App
      - Generated/sidedesk_core.swift
    dependencies:
      - framework: Generated/SideDeskCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hyeonsikoh.sidedesk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  SideDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SideDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SideDesk:
    build:
      targets:
        SideDesk: all
        SideDeskTests: [test]
    test:
      targets:
        - SideDeskTests
